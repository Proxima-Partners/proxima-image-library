name: Check public production contract (read only)

# No schedule until observation, ownership and alert delivery are approved.
# No provider credentials, catalog scans, OIDC, Azure changes or application writes.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed currently deployed full source commit
        type: string
        required: true
      build_id:
        description: Reviewed currently deployed run-attempt build ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: image-library-public-health
  cancel-in-progress: false

jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEMETRY_ENABLED: 'false'
    steps:
      - name: Require separately approved enablement
        env:
          ENABLED: ${{ vars.IMAGE_LIBRARY_PUBLIC_CHECKS_ENABLED }}
        run: test "$ENABLED" = 'true'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare isolated pinned dependencies
        run: |
          python3.12 -m venv .operations-venv
          .operations-venv/bin/python -m pip install --only-binary=:all: -r requirements.txt
          .operations-venv/bin/python -m pip check
          mkdir -p reports
      - name: Four bounded anonymous GET checks
        env:
          IMAGE_LIBRARY_PUBLIC_CHECKS_ENABLED: 'true'
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_BUILD: ${{ inputs.build_id }}
        run: |
          .operations-venv/bin/python -m scripts.operations_health \
            --commit "$EXPECTED_COMMIT" --build-id "$EXPECTED_BUILD" > reports/public-health.json
      - name: Retain sanitized point-in-time evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          archive: true
          name: public-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/public-health.json
          retention-days: 90
          if-no-files-found: warn
