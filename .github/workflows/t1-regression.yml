name: T1 Regression

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  t1-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_MODE: 'true'
      STORAGE_MODE: local
      FLASK_SECRET_KEY: ci-only-not-a-production-secret-000000
      TELEMETRY_ENABLED: 'false'
      PYTHON_DOTENV_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Audit resolved production dependencies
        run: pip-audit -r requirements.txt --strict --format json --output dependency-audit.json

      - name: Run full isolated regression suite (includes T1)
        run: python -m pytest tests -q --junitxml=test_data/pytest-report.xml

      - name: Upload test and dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          archive: true
          name: validation-reports
          path: |
            test_data/pytest-report.xml
            test_data/t1_last_report.json
            dependency-audit.json
