name: T1 Regression

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  t1-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MODE: 'true'
      STORAGE_MODE: local
      FLASK_SECRET_KEY: ci-only-not-a-production-secret-000000
      TELEMETRY_ENABLED: 'false'
      PYTHON_DOTENV_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Audit resolved production dependencies
        run: pip-audit -r requirements.txt --strict --format json --output dependency-audit.json

      - name: Run full isolated regression suite (includes T1)
        run: python -m pytest tests -q --junitxml=test_data/pytest-report.xml

      - name: Upload test and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            test_data/pytest-report.xml
            test_data/t1_last_report.json
            dependency-audit.json
